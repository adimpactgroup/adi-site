<svg xmlns="http://www.w3.org/2000/svg" width="220" height="80" viewBox="0 0 220 80" role="img" aria-labelledby="walkerTitle walkerDesc" preserveAspectRatio="xMidYMid meet">
  <title id="walkerTitle">WALKER stamp</title>
  <desc id="walkerDesc">Minimal rectangular stamp with gold stroke and the word WALKER centered in Playfair Display.</desc>

  <rect x="4" y="4" width="212" height="72" rx="8" ry="8"
        fill="none" stroke="#D4AF37" stroke-width="4" stroke-linejoin="round"/>

  <text x="110" y="52" text-anchor="middle"
        font-family="Playfair Display, Georgia, serif"
        font-size="36" font-weight="700"
        fill="#D4AF37" dominant-baseline="middle">WALKER</text>
</svg>
